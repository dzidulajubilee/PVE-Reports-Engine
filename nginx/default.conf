# HTTPS in front of the reports portal: https://server (host port PORTAL_PORT, default 443).
# Plain http://server (HTTP_PORT, default 80) only redirects to HTTPS.
# install.sh makes a self-signed certificate in nginx/certs; to use your own, replace server.crt (with any
# intermediate certificates) and server.key there, then: docker compose restart nginx

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:1m;
server_tokens       off;

# The reporter, found through Docker's DNS. "resolve" re-checks its address in the background, so nginx starts
# even when the reporter is down and follows it to a new address after a restart, without resolving names per
# request (request-time resolution with a variable proxy_pass is part of CVE-2026-123634).
resolver 127.0.0.11 valid=30s ipv6=off;
upstream reporter {
    zone reporter 64k;
    server reporter:8088 resolve;
}

# HTTP/2 and HTTP/3 stay off on purpose: the portal doesn't need them, and they were the way in for the worst
# nginx bugs of 2026 (CVE-2026-123007, -123633, -121810). Don't add "http2" or "quic" without checking advisories.

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 300s;
client_max_body_size 4m;
add_header Strict-Transport-Security "max-age=31536000" always;

server {
    listen 8443 ssl;
    error_page 497 =301 https://$http_host$request_uri; # http:// on the HTTPS port goes to https://, same port
    location / { proxy_pass http://reporter; }
}

server {
    listen 8080;
    return 301 https://$host$request_uri;
}
