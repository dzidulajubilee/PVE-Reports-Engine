# HTTPS in front of the reports portal: https://server:8443
# install.sh makes a self-signed certificate in nginx/certs; to use your own, replace server.crt (with any
# intermediate certificates) and server.key there, then: docker compose restart nginx

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:1m;
server_tokens       off;

# Docker's DNS, looked up on each request, so nginx starts even when the reporter is down
resolver 127.0.0.11 valid=30s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 300s;
client_max_body_size 4m;
add_header Strict-Transport-Security "max-age=31536000" always;

server {
    listen 8443 ssl;
    error_page 497 =301 https://$host:$server_port$request_uri; # http:// on this port goes to https://
    location / { set $up http://reporter:8088; proxy_pass $up; }
}
